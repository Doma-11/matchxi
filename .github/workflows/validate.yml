name: MatchXI validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: matchxi-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.9.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-matchxi-isolation.mjs
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - run: npx netlify functions:build --src netlify/functions --functions .netlify/functions
