name: MatchXI validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The imported upstream npm lock has an existing AJV dependency mismatch.
      # Install and resolve it in CI without changing the original repository.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npm run build
