[build]
command = "npm run build"
publish = "dist"
[build.environment]
NODE_VERSION = "22"
NPM_VERSION = "11.9.0"
# This application builds with Vite; Next.js remains an inherited dependency.
NETLIFY_NEXT_PLUGIN_SKIP = "true"
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
[functions."portrait-image"]
external_node_modules = ["sharp"]
included_files = ["node_modules/@img/sharp-linux-x64/**", "node_modules/@img/sharp-libvips-linux-x64/**"]
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
